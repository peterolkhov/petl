name: "[AI] Observe unchanged Actual Cash Flow day ranges170"
'on':
  workflow_dispatch: {}
  push:
    branches:
      - codex/observe-actual-cashflow170
permissions:
  contents: read
jobs:
  observe:
    if: github.ref == 'refs/heads/codex/observe-actual-cashflow170'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - name: Check out complete unchanged pinned Actual source
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        repository: actualbudget/actual
        ref: 414bfd31978847980a8b6dda74bf6c4e696eee5e
        path: actual-source164
        fetch-depth: 1
        persist-credentials: false
    - name: Select upstream-pinned Node without cache services
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
      with:
        node-version-file: actual-source164/.nvmrc
        package-manager-cache: false
    - name: Materialize reviewed desktop164.test.ts
      shell: bash
      run: |
        python3 - <<'PAYLOAD'
        import base64,hashlib,pathlib
        data=base64.b64decode('')
        assert hashlib.sha256(data).hexdigest()=='fa2792dfbbfdf4be8f261b4dd62fa028b0ecca507ac15154371e2358aa9f452b'
        p=pathlib.Path('.probe164')/'desktop164.test.ts'
        p.parent.mkdir(parents=True,exist_ok=True)
        p.write_bytes(data)
        PAYLOAD
    - name: Materialize reviewed native164.test.ts
      shell: bash
      run: |
        python3 - <<'PAYLOAD'
        import base64,hashlib,pathlib
        data=base64.b64decode('')
        assert hashlib.sha256(data).hexdigest()=='89bbf3e20aab4338c065eb96710576e2acc7b4e5fb3c22ec3e9d03a4b6c4f9c1'
        p=pathlib.Path('.probe164')/'native164.test.ts'
        p.parent.mkdir(parents=True,exist_ok=True)
        p.write_bytes(data)
        PAYLOAD
    - name: Materialize reviewed runner170.py
      shell: bash
      run: |
        python3 - <<'PAYLOAD'
        import base64,hashlib,pathlib
        data=base64.b64decode('')
        assert hashlib.sha256(data).hexdigest()=='d0c711fc13eb69f905d47ed55a9df9f81e1a19d81a381f8153f607a479a41f37'
        p=pathlib.Path('.probe164')/'runner170.py'
        p.parent.mkdir(parents=True,exist_ok=True)
        p.write_bytes(data)
        PAYLOAD
    - name: Materialize reviewed fixtures.json
      shell: bash
      run: |
        python3 - <<'PAYLOAD'
        import base64,hashlib,pathlib
        data=base64.b64decode('')
        assert hashlib.sha256(data).hexdigest()=='2be80b65e786d4618f03bd965c5df6db46623969d5f08cf4632ab98dfd2b2caf'
        p=pathlib.Path('.probe164')/'fixtures.json'
        p.parent.mkdir(parents=True,exist_ok=True)
        p.write_bytes(data)
        PAYLOAD
    - name: Materialize reviewed expected-cases.json
      shell: bash
      run: |
        python3 - <<'PAYLOAD'
        import base64,hashlib,pathlib
        data=base64.b64decode('')
        assert hashlib.sha256(data).hexdigest()=='02b8eec7b25ba390ec56076df393f6299355c4af62cd0a6fc7541adb193a8a46'
        p=pathlib.Path('.probe164')/'expected-cases.json'
        p.parent.mkdir(parents=True,exist_ok=True)
        p.write_bytes(data)
        PAYLOAD
    - name: Observe unchanged callbacks and verify exact native JUnit outcomes
      shell: bash
      run: python3 .probe164/runner170.py
    - name: Emit lossless raw logs reports and before-after records through console only
      if: always()
      shell: bash
      run: python3 .probe164/runner170.py emit
