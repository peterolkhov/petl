name: Lmfit141 official Windows strict HTML original and candidate
'on':
  workflow_dispatch: {}
  push:
    branches:
    - codex/verify-lmfit-windows141
permissions:
  contents: read
jobs:
  windows-html:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-latest
          python: '3.14'
          dependencies: latest
          phase: before
        - os: windows-latest
          python: '3.14'
          dependencies: latest
          phase: after
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      NEW119_PHASE: ${{ matrix.phase }}
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      PIP_NO_CACHE_DIR: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
    - name: Checkout whole exact upstream source
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: lmfit/lmfit-py
        ref: 3a2439c2061ddeaf4cca8f99eb70a069e6a51a41
        path: target
        fetch-depth: 1
        persist-credentials: false
    - name: Setup Python without cache
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: ${{ matrix.python }}
    - name: Stage reviewed source and runtime guard
      shell: bash
      run: "set -euo pipefail\nexport NEW108_SOURCE=\"$GITHUB_WORKSPACE/target\"\nexport NEW108_EVIDENCE=\"$RUNNER_TEMP/new119-evidence\"\nmkdir -p \"$NEW108_EVIDENCE\"\necho \"NEW108_SOURCE=$NEW108_SOURCE\" >> \"$GITHUB_ENV\"\necho \"NEW108_EVIDENCE=$NEW108_EVIDENCE\" >> \"$GITHUB_ENV\"\ncat > \"$NEW108_EVIDENCE/probe-guard.py\" <<'NEW119_PROBE_GUARD_PY'\n\"\"\"Unexecuted hosted-runner provenance proposal; no target imports.\"\"\"\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport shutil\nimport stat\nimport subprocess\nimport sys\nimport sysconfig\n\nroot = Path(os.environ['NEW108_SOURCE']).resolve()\ndestination = Path(os.environ['NEW108_EVIDENCE']).resolve()\nstage = sys.argv[1]\nsnapshot_label = sys.argv[2] if len(sys.argv) > 2 else 'public16'\nif snapshot_label not in ['public16', 'focused40']:\n    raise RuntimeError('invalid full-runtime snapshot label')\nexpected_head = '3a2439c2061ddeaf4cca8f99eb70a069e6a51a41'\nexpected_tree = '0f9806e9012d23735d055fc0b4f647212e44c180'\nexpected_index_tree = expected_tree\nexpected_status = ''\nif os.environ.get('NEW119_PHASE') == 'after':\n    expected_index_tree = 'cc96366bdd5d7ee3e1fd8695ba24a677daf96d22'\n    expected_status = 'M  doc/model.rst\\nM  doc/whatsnew.rst\\nM  lmfit/model.py\\nM  tests/test_model.py\\n'\n\n\n\ndef git(*arguments):\n    return subprocess.check_output(['git', '-C', str(root), *arguments])\n\n\ndef file_record(path):\n    info = path.lstat()\n    if stat.S_ISLNK(info.st_mode):\n        return {'type': 'symlink', 'target': os.readlink(path)}\n    if not stat.S_ISREG(info.st_mode):\n        raise RuntimeError('unexpected runtime entry type: '+str(path))\n    digest = hashlib.sha256()\n    with path.open('rb') as stream:\n        while chunk := stream.read(1024*1024):\n            digest.update(chunk)\n    return {'type': 'file', 'size': info.st_size, 'mode': info.st_mode & 0o777,\n            'sha256': digest.hexdigest()}\n\n\ndef collect(parent, output):\n    if parent.is_file() or parent.is_symlink():\n        output[str(parent)] = file_record(parent)\n        return\n    for current, directories, filenames in os.walk(parent, followlinks=False):\n        directories[:] = [name for name in directories if name not in\n                           ['.git', '__pycache__', '.pytest_cache', '.mypy_cache']]\n        for name in list(directories):\n            path = Path(current)/name\n            if path.is_symlink():\n                output[str(path)] = file_record(path)\n                directories.remove(name)\n        for name in filenames:\n            if not name.endswith(('.pyc', '.pyo')):\n                path = Path(current)/name\n                output[str(path)] = file_record(path)\n\n\nindex = git('ls-files', '--stage', '-z')\ntracked = {}\nfor record in index.split(b'\\0'):\n    if not record:\n        continue\n    header, encoded_name = record.split(b'\\t', 1)\n    mode, oid, index_stage = header.split()\n    if index_stage != b'0':\n        raise RuntimeError('unmerged index stage')\n    name = os.fsdecode(encoded_name)\n    path = root/name\n    info = path.lstat()\n    if mode == b'120000':\n        if not stat.S_ISLNK(info.st_mode):\n            raise RuntimeError('tracked symlink type changed: '+name)\n        raw = os.fsencode(os.readlink(path))\n    elif mode in [b'100644', b'100755']:\n        if not stat.S_ISREG(info.st_mode):\n            raise RuntimeError('tracked regular file type changed: '+name)\n        actual_mode = mode if os.name == 'nt' else (b'100755' if info.st_mode & 0o111 else b'100644')\n        if actual_mode != mode:\n            raise RuntimeError('tracked executable mode changed: '+name)\n        descriptor = os.open(path, os.O_RDONLY | getattr(os, 'O_NOFOLLOW', 0))\n        with os.fdopen(descriptor, 'rb') as stream:\n            raw = stream.read()\n    else:\n        raise RuntimeError('unsupported tracked Git mode: '+mode.decode())\n    actual_blob = hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\\0'+raw).hexdigest()\n    if actual_blob != oid.decode():\n        raise RuntimeError('actual tracked blob differs from index: '+name)\n    tracked[name] = {'index_mode': mode.decode(), 'index_blob': oid.decode(),\n                     'actual_blob': actual_blob, 'file': file_record(path)}\nsource = {\n    'head': git('rev-parse', 'HEAD').decode().strip(),\n    'tree': git('rev-parse', 'HEAD^{tree}').decode().strip(),\n    'index_tree': git('write-tree').decode().strip(),\n    'index_sha256': hashlib.sha256(index).hexdigest(),\n    'tracked': tracked,\n    'tracked_status': git('status', '--porcelain', '--untracked-files=no').decode(),\n}\nif (source['head'] != expected_head or source['tree'] != expected_tree\n        or source['index_tree'] != expected_index_tree\n        or source['tracked_status'] != expected_status):\n    raise RuntimeError('whole source does not match reviewed base/candidate commit/tree/index')\ndata = {'source': source}\nif stage != 'source':\n    consumed = {}\n    for parent in [root, Path(sys.prefix), Path(sysconfig.get_path('stdlib')),\n                   Path(sys.executable).resolve(), destination/'probe-before.py',\n                   destination/'probe-guard.py', destination/'probe-assess.py',\n                   destination/'probe-assess-after.py', destination/'fix.patch',\n                   destination/'test_complex_weight_regressions.py',\n                   destination/'critical-runtime-guard.py']:\n        collect(parent, consumed)\n    for command in ['git', 'ldd', 'nm']:\n        executable = shutil.which(command)\n        if executable is None:\n            raise RuntimeError('missing guard tool: '+command)\n        collect(Path(executable).resolve(), consumed)\n    binaries = [Path(sys.executable).resolve()]\n    extension_symbols = {}\n    for name, item in consumed.items():\n        if item['type'] != 'file' or not (name.endswith('.so') or '.so.' in name):\n            continue\n        process = subprocess.run(['nm', '-D', '--defined-only', name],\n                                 capture_output=True, text=True)\n        if process.returncode != 0:\n            raise RuntimeError('ELF export scan failed: '+name+' '+process.stderr)\n        symbols = sorted(line.split()[-1] for line in process.stdout.splitlines()\n                         if line.split() and line.split()[-1].startswith('PyInit_'))\n        if symbols:\n            extension_symbols[name] = symbols\n            binaries.append(Path(name))\n    linked = {}\n    for binary in sorted(set(binaries)):\n        process = subprocess.run(['ldd', str(binary)], capture_output=True, text=True)\n        if process.returncode not in [0, 1]:\n            raise RuntimeError('ELF dependency scan failed: '+str(binary))\n        if 'not found' in process.stdout:\n            raise RuntimeError('ELF dependency missing: '+str(binary)+' '+process.stdout)\n        for word in process.stdout.split():\n            if word.startswith('/') and Path(word).is_file():\n                path = Path(word).resolve()\n                linked[str(path)] = file_record(path)\n    data.update(consumed=consumed, linked=linked, extension_symbols=extension_symbols,\n                elf_roots=sorted(str(binary) for binary in set(binaries)),\n                executable=str(Path(sys.executable).resolve()),\n                prefix=sys.prefix, base_prefix=sys.base_prefix)\nif stage == 'source':\n    (destination/'guard-source.json').write_text(json.dumps(data, sort_keys=True))\nelse:\n    original = json.loads((destination/'guard-source.json').read_text())\n    if original['source'] != source:\n        raise RuntimeError('original tracked source changed during install/probe')\n    if stage == 'before':\n        (destination/('guard-before-'+snapshot_label+'.json')).write_text(json.dumps(data, sort_keys=True))\n    elif stage == 'after':\n        before = json.loads((destination/('guard-before-'+snapshot_label+'.json')).read_text())\n        if before != data:\n            for key in ['consumed', 'linked']:\n                print('NEW108_CHANGED', key, [name for name in\n                    set(before.get(key, {})) | set(data.get(key, {}))\n                    if before.get(key, {}).get(name) != data.get(key, {}).get(name)], flush=True)\n            raise RuntimeError('consumed source/build/dependency/runtime guard changed')\n    else:\n        raise RuntimeError('invalid guard stage')\nprint('NEW108_GUARD', json.dumps({\n    'stage': stage, 'snapshot_label': snapshot_label,\n    'phase': os.environ.get('NEW119_PHASE'), 'head': source['head'], 'tree': source['tree'],\n    'index_tree': source['index_tree'], 'index_sha256': source['index_sha256'],\n    'tracked_count': len(tracked), 'all_actual_git_blobs_match': True,\n    'filesystem_tracks_executable_mode': os.name != 'nt',\n    'tracked_sha256': hashlib.sha256(json.dumps(tracked, sort_keys=True).encode()).hexdigest(),\n    'consumed_count': len(data.get('consumed', {})),\n    'consumed_sha256': hashlib.sha256(json.dumps(data.get('consumed', {}), sort_keys=True).encode()).hexdigest(),\n    'linked_count': len(data.get('linked', {})),\n    'elf_root_count': len(data.get('elf_roots', [])),\n    'extension_root_count': len(data.get('extension_symbols', {})), 'unchanged': True,\n}), flush=True)\nNEW119_PROBE_GUARD_PY\nsha256sum \"$NEW108_EVIDENCE/probe-guard.py\"\n"
    - name: Stage critical runtime provenance helper
      shell: bash
      run: "set -euo pipefail\ncat > \"$NEW108_EVIDENCE/critical-runtime-guard.py\" <<'NEW119_CRITICAL_RUNTIME_GUARD_PY'\n\"\"\"Hosted-only critical runtime provenance, distinct from the complete ELF guard.\n\nThis hashes explicit actual module/interpreter/solver/helper files. It does not\nclaim an entire environment or transitive loader closure for official suites.\n\"\"\"\nimport hashlib\nimport importlib\nimport importlib.metadata\nimport inspect\nimport json\nimport os\nfrom pathlib import Path\nimport platform\nimport subprocess\nimport sys\nimport sysconfig\n\nimport lmfit\nimport numpy as np\nimport scipy\nfrom scipy.optimize import least_squares, leastsq\n\nroot = Path(os.environ['NEW108_SOURCE']).resolve()\ndestination = Path(os.environ['NEW108_EVIDENCE']).resolve()\noperation, label = sys.argv[1:3]\nif operation not in ['baseline', 'check'] or label not in ['public16', 'focused40', 'full-suite', 'style-docs']:\n    raise RuntimeError('invalid critical provenance operation/label')\n\n\ndef sha256(path):\n    value = hashlib.sha256()\n    with path.open('rb') as stream:\n        while chunk := stream.read(1024*1024):\n            value.update(chunk)\n    return value.hexdigest()\n\n\nfiles = {}\n\n\ndef add_file(path):\n    path = Path(path).resolve()\n    if not path.is_file():\n        raise RuntimeError('critical runtime file missing: '+str(path))\n    files[str(path)] = {'bytes': path.stat().st_size, 'sha256': sha256(path)}\n    return str(path)\n\n\nmodules = {}\n\n\ndef add_module(module):\n    if getattr(module, '__file__', None):\n        path = add_file(module.__file__)\n        modules[module.__name__] = path\n        if module.__name__ == 'lmfit' or module.__name__.startswith('lmfit.'):\n            if not Path(path).is_relative_to(root):\n                raise RuntimeError('critical lmfit module outside whole source: '+path)\n\n\nfor name in ['lmfit', 'lmfit.model', 'lmfit.minimizer', 'numpy', 'scipy',\n             'numpy._core._multiarray_umath', 'numpy.linalg._umath_linalg',\n             'scipy.optimize._minpack', 'scipy.optimize._lsq.trf',\n             'pytest', '_pytest.runner', '_pytest.python', '_pytest.assertion.rewrite']:\n    add_module(importlib.import_module(name))\n# Hash every actual lmfit source module, including the generated version module.\nfor path in sorted((root/'lmfit').glob('*.py')):\n    add_file(path)\n\nfunctions = {}\nfor name, function in [('scipy.optimize.leastsq', leastsq),\n                       ('scipy.optimize.least_squares', least_squares)]:\n    module = importlib.import_module(function.__module__)\n    add_module(module)\n    source = inspect.getsourcefile(function)\n    if source is None:\n        raise RuntimeError('solver has no inspectable source: '+name)\n    record = {'module': function.__module__, 'qualname': function.__qualname__,\n              'source_file': add_file(source)}\n    if hasattr(function, '__code__'):\n        record['function_code_sha256'] = hashlib.sha256(function.__code__.co_code).hexdigest()\n    functions[name] = record\n    # Follow the actual public solver's immediate numerical backend references.\n    for key in ['_minpack', 'trf', 'dogbox', 'call_minpack']:\n        backend = getattr(function, '__globals__', {}).get(key)\n        if inspect.ismodule(backend):\n            add_module(backend)\n        elif inspect.isfunction(backend):\n            add_module(importlib.import_module(backend.__module__))\n\nhelpers = {}\nfor name in ['probe-guard.py', 'critical-runtime-guard.py', 'fix.patch', 'strict_sphinx.py', 'constraints.txt']:\n    path = destination/name\n    helpers[name] = {'path': add_file(path), 'sha256': sha256(path)}\nif label in ['public16', 'focused40']:\n    for name in ['probe-before.py', 'probe-assess.py', 'probe-assess-after.py',\n                 'test_complex_weight_regressions.py']:\n        path = destination/name\n        helpers[name] = {'path': add_file(path), 'sha256': sha256(path)}\n\ninterpreter = add_file(Path(sys.executable).resolve())\nfor module in [hashlib, importlib, inspect, json, platform, subprocess, sysconfig]:\n    add_module(module)\nsource = {name: subprocess.check_output(['git', '-C', str(root), *args]).decode().strip()\n          for name, args in [('head', ['rev-parse', 'HEAD']),\n                             ('head_tree', ['rev-parse', 'HEAD^{tree}']),\n                             ('index_tree', ['write-tree'])]}\ndata = {'scope': 'explicit actual source/module/solver/interpreter/helper files; not all runtime files or transitive linked libraries',\n        'source': source, 'phase': os.environ['NEW119_PHASE'], 'label': label,\n        'python': {'version': sys.version, 'implementation': platform.python_implementation(),\n                   'platform': platform.platform(), 'executable': interpreter,\n                   'prefix': sys.prefix, 'base_prefix': sys.base_prefix,\n                   'stdlib': sysconfig.get_path('stdlib')},\n        'versions': {name: importlib.metadata.version(name) for name in\n                     ['lmfit', 'numpy', 'scipy', 'asteval', 'uncertainties', 'dill', 'pytest']},\n        'runtime_versions': {'lmfit': lmfit.__version__, 'numpy': np.__version__,\n                             'scipy': scipy.__version__},\n        'declared_generated_outputs': {\n            'public16': ['runner-temporary raw observations/status/guard manifests'],\n            'focused40': ['runner-temporary pytest log/JUnit/status/guard manifests',\n                          'pytest .pytest_cache (excluded by the unchanged complete guard)'],\n            'full-suite': ['coverage HTML and .coverage', 'pytest .pytest_cache',\n                           'runner-temporary native logs/status/critical manifests',\n                           'Windows doc/_build, doc/examples, examples/documentation, doc/extensions.py'],\n            'style-docs': ['doc/_build, doc/examples, examples/documentation, doc/extensions.py',\n                           'gallery execution data and timing reports',\n                           'runner-temporary pre-commit environments, logs/status/critical manifests']\n        }[label],\n        'output_scope': 'Generated outputs are declared, not accepted as exceptions to tracked-source or critical-file checks; untracked outputs are outside this explicit-file snapshot.',\n        'modules': dict(sorted(modules.items())), 'solvers': functions,\n        'helpers': helpers, 'files': dict(sorted(files.items()))}\nsnapshot = destination/('critical-baseline-'+label+'.json')\nif operation == 'baseline':\n    snapshot.write_text(json.dumps(data, sort_keys=True))\nelse:\n    before = json.loads(snapshot.read_text())\n    if before != data:\n        print('NEW119_CRITICAL_CHANGED_FILES', json.dumps(sorted(\n            name for name in set(before['files']) | set(data['files'])\n            if before['files'].get(name) != data['files'].get(name))), flush=True)\n        raise RuntimeError('critical runtime provenance changed during '+label)\nprint('NEW119_CRITICAL_RUNTIME', json.dumps({\n    'operation': operation, 'file_count': len(files),\n    'manifest_sha256': hashlib.sha256(json.dumps(data, sort_keys=True).encode()).hexdigest(),\n    'provenance': data, 'unchanged': operation == 'check'}, sort_keys=True), flush=True)\nNEW119_CRITICAL_RUNTIME_GUARD_PY\nsha256sum \"$NEW108_EVIDENCE/critical-runtime-guard.py\"\n"
    - name: Stage exact candidate patch
      shell: bash
      run: "set -euo pipefail\ncat > \"$NEW108_EVIDENCE/fix.patch\" <<'NEW119_FIX_PATCH'\n--- a/doc/model.rst\n+++ b/doc/model.rst\n@@ -686,6 +686,13 @@\n **will always be coerced** to an 1-dimensional ndarray with dtype \"float64\"\n when it is passed to the solver. If it cannot be coerced, an error will occur\n and the fit will be aborted.\n+\n+For complex data or model output, real and imaginary residual components are\n+handled separately. Real weights apply equally to both components. With\n+complex weights, ``weights.real`` multiplies the real residual and\n+``weights.imag`` multiplies the imaginary residual, rather than performing\n+complex multiplication. For example, a residual ``1+2j`` with weight\n+``3+4j`` contributes ``3**2 + 8**2`` to chi-square.\n \n That coercion will usually work for \"array like\" data that is not already a\n float64 ndarray.  But, depending on the model function, the calculations within\n--- a/doc/whatsnew.rst\n+++ b/doc/whatsnew.rst\n@@ -26,6 +26,8 @@\n \n Fixes:\n \n+- apply complex weights independently to real and imaginary model residuals,\n+  restoring the documented weighted objective and fit statistics\n - prevent log-normal evaluations from modifying input arrays and allow read-only\n   coordinate arrays\n - avoid overflowing gamma factors in ``pearson7``, ``students_t``, and\n--- a/lmfit/model.py\n+++ b/lmfit/model.py\n@@ -878,11 +878,8 @@\n         real part of the weights are applied to the real part of the\n         residual and the imaginary part is treated correspondingly.\n \n-        Since the underlying `scipy.optimize` routines expect\n-        ``numpy.float`` arrays, the only complex type supported is\n-        ``complex``.\n-\n-        The \"ravels\" throughout are necessary to support `pandas.Series`.\n+        Complex residuals are converted to a one-dimensional array of\n+        interleaved real and imaginary parts for `scipy.optimize`.\n \n         \"\"\"\n         model = self.eval(params, **kwargs)\n@@ -895,16 +892,19 @@\n \n         diff = data - model\n \n-        if diff.dtype is complex:\n-            # data/model are complex\n-            diff = diff.ravel().view(float)\n+        if np.iscomplexobj(diff):\n+            diff = np.asarray(diff, dtype=complex)\n             if weights is not None:\n-                if weights.dtype is complex:\n-                    # weights are complex\n-                    weights = weights.ravel().view(float)\n+                weights = np.asarray(weights)\n+                if weights.size == diff.size:\n+                    # Weights need the same size, not necessarily the same shape.\n+                    weights = weights.reshape(diff.shape)\n+                if np.iscomplexobj(weights):\n+                    diff.real *= np.real(weights)\n+                    diff.imag *= np.imag(weights)\n                 else:\n-                    # real weights but complex data\n-                    weights = (weights + 1j * weights).ravel().view(float)\n+                    diff *= weights\n+            return diff.ravel().view(float)\n         if weights is not None:\n             diff *= weights\n         return diff\n--- a/tests/test_model.py\n+++ b/tests/test_model.py\n@@ -469,6 +469,97 @@\n         else:\n             assert result.userkws['x'].dtype == expected_dtype\n             assert result.userargs[0].dtype == expected_dtype\n+\n+\n+@pytest.mark.parametrize('method', ['leastsq', 'least_squares'])\n+@pytest.mark.parametrize('weight_dtype', [np.complex64, np.complex128, '>c16'])\n+@pytest.mark.parametrize('layout', ['C', 'F', 'strided', 'reversed'])\n+def test_complex_model_weighted_fit(method, weight_dtype, layout):\n+    \"\"\"Complex weights minimize the independent quadrature objective.\"\"\"\n+    x = np.arange(1., 7.)\n+    if layout in ('F', 'strided'):\n+        x = x.reshape(2, 3)\n+    data = 2j*x\n+    weights = np.full(x.shape, 1+10j, dtype=weight_dtype)\n+    if layout == 'F':\n+        x, data, weights = (np.asfortranarray(arr) for arr in (x, data, weights))\n+    elif layout == 'strided':\n+        x, data, weights = (np.stack((arr, arr), axis=-1)[..., 0]\n+                            for arr in (x, data, weights))\n+    elif layout == 'reversed':\n+        x, data, weights = (arr[::-1] for arr in (x, data, weights))\n+    originals = [arr.copy() for arr in (x, data, weights)]\n+    for arr in (x, data, weights):\n+        arr.setflags(write=False)\n+\n+    def complex_model(x, a):\n+        return a*(1+1j)*x\n+\n+    result = Model(complex_model).fit(data, x=x, a=0.5, weights=weights,\n+                                      method=method)\n+\n+    # The objective is sum(x**2)*(a**2 + 100*(2-a)**2).\n+    expected_a = 200/101\n+    expected_residual = np.column_stack((-200*x.ravel()/101,\n+                                         20*x.ravel()/101)).ravel()\n+    assert result.success\n+    assert_allclose(result.params['a'].value, expected_a, rtol=1.e-7)\n+    assert_allclose(result.residual, expected_residual, rtol=1.e-7)\n+    assert_allclose(result.chisqr, 400*np.sum(x*x)/101, rtol=1.e-7)\n+    for original, actual in zip(originals, (x, data, weights)):\n+        np.testing.assert_array_equal(actual, original, strict=True)\n+\n+\n+@pytest.mark.parametrize('method', ['leastsq', 'least_squares'])\n+@pytest.mark.parametrize('weight_kind', ['none', 'real', 'equal', 'scalar',\n+                                         'list', 'broadcast', 'flat', 'real_only'])\n+def test_complex_model_weight_controls(method, weight_kind):\n+    \"\"\"Weighting preserves ordinary fits and supported array-like inputs.\"\"\"\n+    x = np.arange(1., 7.).reshape(2, 3)\n+    data = 2j*x\n+    if weight_kind == 'none':\n+        weights = None\n+    elif weight_kind in ('real', 'real_only'):\n+        weights = 1+0.1*x\n+    elif weight_kind == 'equal':\n+        weights = np.full(x.shape, 1+1j)\n+    elif weight_kind == 'scalar':\n+        weights = 1+10j\n+    elif weight_kind == 'flat':\n+        weights = np.full(x.size, 1+10j)\n+    elif weight_kind == 'list':\n+        weights = np.full(x.shape, 1+10j).tolist()\n+    else:\n+        weights = np.full((1, 3), 1+10j)\n+    is_real = weight_kind == 'real_only'\n+    if is_real:\n+        data = 2*x+0.1*np.sin(x)\n+    originals = [np.copy(arr) for arr in (x, data, weights)\n+                 if arr is not None]\n+\n+    def model(x, a):\n+        return a*x if is_real else a*(1+1j)*x\n+\n+    result = Model(model).fit(data, x=x, a=0.5, weights=weights, method=method)\n+    expected_weights = weights\n+    if weight_kind == 'flat':\n+        expected_weights = weights.reshape(x.shape)\n+    wr = 1 if weights is None else np.real(expected_weights)\n+    wi = np.imag(expected_weights) if np.iscomplexobj(weights) else wr\n+    if is_real:\n+        expected_a = np.sum(wr**2*x*data)/np.sum(wr**2*x*x)\n+        expected_residual = ((data-expected_a*x)*wr).ravel()\n+    else:\n+        expected_a = 200/101 if weight_kind in ('scalar', 'list', 'broadcast', 'flat') else 1\n+        expected_residual = np.stack((-expected_a*x*wr,\n+                                      (2-expected_a)*x*wi), axis=-1).ravel()\n+    assert result.success\n+    assert_allclose(result.params['a'].value, expected_a, rtol=1.e-7)\n+    assert_allclose(result.residual, expected_residual, rtol=1.e-7, atol=1.e-7)\n+    assert_allclose(result.chisqr, np.sum(expected_residual**2), rtol=1.e-7)\n+    actuals = [np.asarray(arr) for arr in (x, data, weights) if arr is not None]\n+    for original, actual in zip(originals, actuals):\n+        np.testing.assert_array_equal(actual, original, strict=True)\n \n \n def test_figure_default_title(peakdata):\nNEW119_FIX_PATCH\nsha256sum \"$NEW108_EVIDENCE/fix.patch\"\n"
    - name: Apply only reviewed candidate and freeze complete source
      shell: bash
      run: 'set -euo pipefail

        if [[ "$NEW119_PHASE" == after ]]; then

        git -C "$NEW108_SOURCE" apply --check --index "$NEW108_EVIDENCE/fix.patch"

        git -C "$NEW108_SOURCE" apply --index "$NEW108_EVIDENCE/fix.patch"

        fi

        python "$NEW108_EVIDENCE/probe-guard.py" source

        '
    - name: Build distributions and install project dependencies
      working-directory: target
      shell: bash
      run: 'set -euo pipefail

        echo '''' | base64 --decode > "$NEW108_EVIDENCE/constraints.txt"

        echo '''' | base64 --decode > "$NEW108_EVIDENCE/strict_sphinx.py"

        python -m pip install --no-cache-dir -c "$NEW108_EVIDENCE/constraints.txt" --upgrade pip build setuptools wheel

        python -m build

        python -m pip install --no-cache-dir --no-build-isolation -c "$NEW108_EVIDENCE/constraints.txt" ''.[all]''

        python -m pip list

        python "$NEW108_EVIDENCE/probe-guard.py" source

        PYTHONPATH="$NEW108_SOURCE" python "$NEW108_EVIDENCE/critical-runtime-guard.py" baseline full-suite

        '
    - name: Run official Windows HTML with captured native Sphinx exit
      if: runner.os == 'Windows'
      working-directory: target
      shell: pwsh
      run: '$ErrorActionPreference = ''Stop''

        Remove-Item Env:MPLBACKEND -ErrorAction SilentlyContinue

        $env:SPHINXBUILD = ''python "'' + (Join-Path $env:NEW108_EVIDENCE ''strict_sphinx.py'') + ''"''

        $env:STRICT_SPHINX_STATUS = Join-Path $env:RUNNER_TEMP (''lmfit141-'' + $env:NEW119_PHASE + ''.json'')

        Push-Location doc

        & .\make.bat html 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP (''lmfit141-'' + $env:NEW119_PHASE + ''.log''))

        $batchStatus = $LASTEXITCODE

        Pop-Location

        if (-not (Test-Path $env:STRICT_SPHINX_STATUS)) { throw ''Missing native Sphinx status'' }

        $raw = Get-Content -Raw $env:STRICT_SPHINX_STATUS

        Write-Output (''LMFIT141_STATUS '' + $raw)

        Write-Output (''LMFIT141_BATCH_STATUS '' + $batchStatus)

        $native = $raw | ConvertFrom-Json

        if ($native.returncode -ne 0) { exit $native.returncode }

        '
    - name: Always verify exact original or candidate source and critical runtime
      if: always()
      shell: bash
      run: 'set -euo pipefail

        python "$NEW108_EVIDENCE/probe-guard.py" source

        PYTHONPATH="$NEW108_SOURCE" python "$NEW108_EVIDENCE/critical-runtime-guard.py" check full-suite

        '
    name: Windows strict HTML (${{ matrix.phase }})
