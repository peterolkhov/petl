name: RapidFuzz reviewed sequence truth on Ubuntu and Windows
'on':
  workflow_dispatch: {}
  push:
    branches:
    - codex/verify-rapidfuzz173
permissions:
  contents: read
jobs:
  parity:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-24.04
          python-version: 3.12.12
        - os: windows-latest
          python-version: 3.12.10
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
    - name: Preserve LF checkout bytes on Windows
      if: runner.os == 'Windows'
      shell: bash
      run: 'git config --global core.autocrlf false

        git config --global core.eol lf

        '
    - name: Check out complete pinned RapidFuzz source and recursive gitlinks
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: rapidfuzz/RapidFuzz
        ref: e5ba5955a0979bd316e31972f657dec976774492
        submodules: recursive
        path: rapidfuzz-source173
        persist-credentials: false
    - name: Select reviewed Python version
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: ${{ matrix.python-version }}
    - name: Initialize isolated payload and result paths
      shell: python
      run: "import os\nfrom pathlib import Path\npaths = {\n    \"PAYLOAD173\": Path(os.environ[\"RUNNER_TEMP\"]) / \"rapidfuzz-payload173\"\
        ,\n    \"SOURCE173\": Path(os.environ[\"GITHUB_WORKSPACE\"]) / \"rapidfuzz-source173\",\n    \"RESULTS173\": Path(os.environ[\"\
        RUNNER_TEMP\"]) / \"rapidfuzz-results173\",\n}\npaths[\"PAYLOAD173\"].mkdir()\npaths[\"RESULTS173\"].mkdir()\nwith\
        \ open(os.environ[\"GITHUB_ENV\"], \"a\", encoding=\"utf-8\") as output:\n    for name, path in paths.items():\n \
        \       output.write(f\"{name}={path}\\n\")\n"
    - name: Stage embedded reviewed packet segment 1
      shell: python
      run: "import os\nfrom pathlib import Path\nwith (Path(os.environ['PAYLOAD173']) / 'packet.b64').open('a', encoding='ascii')\
        \ as output:\n    output.write('')\n"
    - name: Stage embedded reviewed packet segment 2
      shell: python
      run: "import os\nfrom pathlib import Path\nwith (Path(os.environ['PAYLOAD173']) / 'packet.b64').open('a', encoding='ascii')\
        \ as output:\n    output.write('')\n"
    - name: Stage embedded reviewed packet segment 3
      shell: python
      run: "import os\nfrom pathlib import Path\nwith (Path(os.environ['PAYLOAD173']) / 'packet.b64').open('a', encoding='ascii')\
        \ as output:\n    output.write('')\n"
    - name: Stage embedded reviewed packet segment 4
      shell: python
      run: "import os\nfrom pathlib import Path\nwith (Path(os.environ['PAYLOAD173']) / 'packet.b64').open('a', encoding='ascii')\
        \ as output:\n    output.write('')\n"
    - name: Stage embedded reviewed packet segment 5
      shell: python
      run: "import os\nfrom pathlib import Path\nwith (Path(os.environ['PAYLOAD173']) / 'packet.b64').open('a', encoding='ascii')\
        \ as output:\n    output.write('')\n"
    - name: Stage embedded reviewed packet segment 6
      shell: python
      run: "import os\nfrom pathlib import Path\nwith (Path(os.environ['PAYLOAD173']) / 'packet.b64').open('a', encoding='ascii')\
        \ as output:\n    output.write('')\n"
    - name: Stage embedded reviewed packet segment 7
      shell: python
      run: "import os\nfrom pathlib import Path\nwith (Path(os.environ['PAYLOAD173']) / 'packet.b64').open('a', encoding='ascii')\
        \ as output:\n    output.write('')\n"
    - name: Stage embedded reviewed packet segment 8
      shell: python
      run: "import os\nfrom pathlib import Path\nwith (Path(os.environ['PAYLOAD173']) / 'packet.b64').open('a', encoding='ascii')\
        \ as output:\n    output.write('')\n"
    - name: Stage embedded reviewed packet segment 9
      shell: python
      run: "import os\nfrom pathlib import Path\nwith (Path(os.environ['PAYLOAD173']) / 'packet.b64').open('a', encoding='ascii')\
        \ as output:\n    output.write('')\n"
    - name: Stage embedded reviewed packet segment 10
      shell: python
      run: "import os\nfrom pathlib import Path\nwith (Path(os.environ['PAYLOAD173']) / 'packet.b64').open('a', encoding='ascii')\
        \ as output:\n    output.write('')\n"
    - name: Unpack and bind all 34 reviewed files
      shell: python
      run: "import base64, hashlib, json, os, zlib\nfrom pathlib import Path\npayload = Path(os.environ[\"PAYLOAD173\"])\n\
        packed = payload / \"packet.b64\"\nfiles = json.loads(zlib.decompress(base64.b64decode(packed.read_bytes(), validate=True)))\n\
        assert len(files) == 34\nfor name, encoded in files.items():\n    path = payload / name\n    assert not Path(name).is_absolute()\
        \ and \"..\" not in Path(name).parts\n    path.parent.mkdir(parents=True, exist_ok=True)\n    path.write_bytes(base64.b64decode(encoded,\
        \ validate=True))\npacked.unlink()\nmanifest_bytes = (payload / \"packet-manifest.json\").read_bytes()\nassert hashlib.sha256(manifest_bytes).hexdigest()\
        \ == \"e85c0c1228b3d7879805db1c5545db89d260afc66087d78cc4f26ae21bde7231\"\nmanifest = json.loads(manifest_bytes)\n\
        assert len(manifest[\"files\"]) == 33\nassert set(files) == {item[\"path\"] for item in manifest[\"files\"]} | {\"\
        packet-manifest.json\"}\nfor item in manifest[\"files\"]:\n    data = (payload / item[\"path\"]).read_bytes()\n  \
        \  assert len(data) == item[\"bytes\"], item[\"path\"]\n    assert hashlib.sha256(data).hexdigest() == item[\"sha256\"\
        ], item[\"path\"]\nprint(\"REVIEWED_PACKET_BOUND\", \"e85c0c1228b3d7879805db1c5545db89d260afc66087d78cc4f26ae21bde7231\"\
        , len(files))\n"
    - name: Execute reviewed validator and retain its raw launch output
      shell: python
      run: "import os, subprocess, sys\nfrom pathlib import Path\nresults = Path(os.environ[\"RESULTS173\"])\ncommand = [sys.executable,\
        \ str(Path(os.environ[\"PAYLOAD173\"]) / \"validate173.py\")]\nwith (results / \"validator-launch.log\").open(\"wb\"\
        ) as output:\n    result = subprocess.run(command, stdout=output, stderr=subprocess.STDOUT, check=False)\n(results\
        \ / \"validator-launch.status\").write_text(str(result.returncode) + \"\\n\", encoding=\"ascii\")\nprint(\"VALIDATOR_EXIT\"\
        , result.returncode, flush=True)\nsys.exit(result.returncode)\n"
    - name: Always print lossless raw validation evidence
      if: always()
      shell: python
      run: "import base64, hashlib, json, os, zlib\nfrom pathlib import Path\nresults = Path(os.environ.get(\"RESULTS173\"\
        , str(Path(os.environ[\"RUNNER_TEMP\"]) / \"rapidfuzz-results173\")))\nsuffixes = {\".log\", \".status\", \".jsonl\"\
        , \".json\", \".xml\"}\nfiles = sorted(path for path in results.glob(\"*\") if path.is_file() and path.suffix in suffixes)\n\
        print(\"RAPIDFUZZ173_RESULTS\", json.dumps({\"count\": len(files), \"encoding\": \"zlib-base64\", \"line_width\":\
        \ 120}), flush=True)\nfor path in files:\n    raw = path.read_bytes()\n    encoded = base64.b64encode(zlib.compress(raw,\
        \ 9)).decode(\"ascii\")\n    meta = {\"filename\": path.name, \"bytes\": len(raw), \"sha256\": hashlib.sha256(raw).hexdigest(),\
        \ \"encoded_bytes\": len(encoded)}\n    print(\"RAPIDFUZZ173_RAW_BEGIN \" + json.dumps(meta, sort_keys=True), flush=True)\n\
        \    for start in range(0, len(encoded), 120):\n        print(encoded[start:start + 120])\n    print(\"RAPIDFUZZ173_RAW_END\
        \ \" + json.dumps({\"filename\": path.name}), flush=True)\n"
