name: '[AI] Verify Actual cash-flow candidate 191'
on:
  push:
    branches:
      - 'codex/verify-actual-cashflow191'
    paths:
      - '.github/workflows/verify-actual-cashflow191.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-after:
    if: github.ref == 'refs/heads/codex/verify-actual-cashflow191'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CI: 'true'
      TZ: UTC
    steps:
    - name: Check out whole pinned Actual source
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        repository: actualbudget/actual
        ref: 414bfd31978847980a8b6dda74bf6c4e696eee5e
        path: actual-source191
        fetch-depth: 1
        persist-credentials: false
    - name: Use upstream Node version
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
      with:
        node-version-file: actual-source191/.nvmrc
        package-manager-cache: false
    - name: Create isolated runtime location
      shell: bash
      run: |
        set -euo pipefail
        runtime_dir="$(mktemp -d "$RUNNER_TEMP/actual191.XXXXXXXX")"
        echo "ACTUAL191_RUNTIME=$runtime_dir" >> "$GITHUB_ENV"
    - name: Stage reviewed runtime chunk 0
      shell: bash
      run: |
        python3 - <<'PY'
        import os
        from pathlib import Path
        p=Path(os.environ['ACTUAL191_RUNTIME'])/'payload.b64'
        with p.open('w') as f:
            f.write('')
        PY
    - name: Stage reviewed runtime chunk 1
      shell: bash
      run: |
        python3 - <<'PY'
        import os
        from pathlib import Path
        p=Path(os.environ['ACTUAL191_RUNTIME'])/'payload.b64'
        with p.open('a') as f:
            f.write('')
        PY
    - name: Verify and restore exact reviewed runtime
      shell: bash
      run: |
        python3 - <<'PY'
        import base64
        import gzip
        import hashlib
        import json
        import os
        from pathlib import Path
        root=Path(os.environ['ACTUAL191_RUNTIME'])
        packed=base64.b64decode((root/'payload.b64').read_text(), validate=True)
        assert hashlib.sha256(packed).hexdigest() == '62f01f8f611bbbdf164faa8f72f34032beba9ac897a96489c5b2bfc594b84b01'
        payload=json.loads(gzip.decompress(packed))
        assert sorted(payload) == ["after-runner.py", "check-after.py", "frozen/desktop164.test.ts", "frozen/expected-cases.json", "frozen/fixtures.json", "frozen/native164.test.ts", "host-wrapper.py", "input-sha256.json", "publisher-manifest.json", "source-files/packages/desktop-client/src/components/reports/spreadsheets/cash-flow-spreadsheet.test.ts", "source-files/packages/desktop-client/src/components/reports/spreadsheets/cash-flow-spreadsheet.tsx", "source-files/upcoming-release-notes/fix-cash-flow-day-ranges.md"]
        for name, encoded in payload.items():
            dest=root/name
            dest.parent.mkdir(parents=True, exist_ok=True)
            dest.write_bytes(base64.b64decode(encoded, validate=True))
        for item in json.loads((root/'input-sha256.json').read_text()):
            raw=(root/item['path']).read_bytes()
            assert len(raw)==item['bytes'] and hashlib.sha256(raw).hexdigest()==item['sha256'], item['path']
        PY
    - name: Run unchanged Actual after recipe and retain lossless output
      shell: bash
      run: |
        set -euo pipefail
        python3 "$ACTUAL191_RUNTIME/host-wrapper.py" "$GITHUB_WORKSPACE/actual-source191"
