    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.10', dependencies: minimum}
          - {os: ubuntu-24.04, python: '3.10', dependencies: latest}
          - {os: ubuntu-24.04, python: '3.11', dependencies: latest}
          - {os: ubuntu-24.04, python: '3.12', dependencies: latest}
          - {os: ubuntu-24.04, python: '3.13', dependencies: latest}
          - {os: ubuntu-24.04, python: '3.14', dependencies: latest}
          - {os: windows-latest, python: '3.14', dependencies: latest}
          - {os: macos-latest, python: '3.14', dependencies: latest}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      NEW119_PHASE: after
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
      PIP_NO_CACHE_DIR: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - name: Checkout whole exact upstream source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lmfit/lmfit-py
          ref: 3a2439c2061ddeaf4cca8f99eb70a069e6a51a41
          path: target
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Python without cache
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Stage reviewed source and runtime guard
        shell: bash
        run: |
          set -euo pipefail
          export NEW108_SOURCE="$GITHUB_WORKSPACE/target"
          export NEW108_EVIDENCE="$RUNNER_TEMP/new119-evidence"
          mkdir -p "$NEW108_EVIDENCE"
          echo "NEW108_SOURCE=$NEW108_SOURCE" >> "$GITHUB_ENV"
          echo "NEW108_EVIDENCE=$NEW108_EVIDENCE" >> "$GITHUB_ENV"
          cat > "$NEW108_EVIDENCE/probe-guard.py" <<'NEW119_PROBE_GUARD_PY'
          """Unexecuted hosted-runner provenance proposal; no target imports."""
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import stat
          import subprocess
          import sys
          import sysconfig
          
          root = Path(os.environ['NEW108_SOURCE']).resolve()
          destination = Path(os.environ['NEW108_EVIDENCE']).resolve()
          stage = sys.argv[1]
          snapshot_label = sys.argv[2] if len(sys.argv) > 2 else 'public16'
          if snapshot_label not in ['public16', 'focused40']:
              raise RuntimeError('invalid full-runtime snapshot label')
          expected_head = '3a2439c2061ddeaf4cca8f99eb70a069e6a51a41'
          expected_tree = '0f9806e9012d23735d055fc0b4f647212e44c180'
          expected_index_tree = expected_tree
          expected_status = ''
          if os.environ.get('NEW119_PHASE') == 'after':
              expected_index_tree = 'cc96366bdd5d7ee3e1fd8695ba24a677daf96d22'
              expected_status = 'M  doc/model.rst\nM  doc/whatsnew.rst\nM  lmfit/model.py\nM  tests/test_model.py\n'
          
          
          
          def git(*arguments):
              return subprocess.check_output(['git', '-C', str(root), *arguments])
          
          
          def file_record(path):
              info = path.lstat()
              if stat.S_ISLNK(info.st_mode):
                  return {'type': 'symlink', 'target': os.readlink(path)}
              if not stat.S_ISREG(info.st_mode):
                  raise RuntimeError('unexpected runtime entry type: '+str(path))
              digest = hashlib.sha256()
              with path.open('rb') as stream:
                  while chunk := stream.read(1024*1024):
                      digest.update(chunk)
              return {'type': 'file', 'size': info.st_size, 'mode': info.st_mode & 0o777,
                      'sha256': digest.hexdigest()}
          
          
          def collect(parent, output):
              if parent.is_file() or parent.is_symlink():
                  output[str(parent)] = file_record(parent)
                  return
              for current, directories, filenames in os.walk(parent, followlinks=False):
                  directories[:] = [name for name in directories if name not in
                                     ['.git', '__pycache__', '.pytest_cache', '.mypy_cache']]
                  for name in list(directories):
                      path = Path(current)/name
                      if path.is_symlink():
                          output[str(path)] = file_record(path)
                          directories.remove(name)
                  for name in filenames:
                      if not name.endswith(('.pyc', '.pyo')):
                          path = Path(current)/name
                          output[str(path)] = file_record(path)
          
          
          index = git('ls-files', '--stage', '-z')
          tracked = {}
          for record in index.split(b'\0'):
              if not record:
                  continue
              header, encoded_name = record.split(b'\t', 1)
              mode, oid, index_stage = header.split()
              if index_stage != b'0':
                  raise RuntimeError('unmerged index stage')
              name = os.fsdecode(encoded_name)
              path = root/name
              info = path.lstat()
              if mode == b'120000':
                  if not stat.S_ISLNK(info.st_mode):
                      raise RuntimeError('tracked symlink type changed: '+name)
                  raw = os.fsencode(os.readlink(path))
              elif mode in [b'100644', b'100755']:
                  if not stat.S_ISREG(info.st_mode):
                      raise RuntimeError('tracked regular file type changed: '+name)
                  actual_mode = mode if os.name == 'nt' else (b'100755' if info.st_mode & 0o111 else b'100644')
                  if actual_mode != mode:
                      raise RuntimeError('tracked executable mode changed: '+name)
                  descriptor = os.open(path, os.O_RDONLY | getattr(os, 'O_NOFOLLOW', 0))
                  with os.fdopen(descriptor, 'rb') as stream:
                      raw = stream.read()
              else:
                  raise RuntimeError('unsupported tracked Git mode: '+mode.decode())
              actual_blob = hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              if actual_blob != oid.decode():
                  raise RuntimeError('actual tracked blob differs from index: '+name)
              tracked[name] = {'index_mode': mode.decode(), 'index_blob': oid.decode(),
                               'actual_blob': actual_blob, 'file': file_record(path)}
          source = {
              'head': git('rev-parse', 'HEAD').decode().strip(),
              'tree': git('rev-parse', 'HEAD^{tree}').decode().strip(),
              'index_tree': git('write-tree').decode().strip(),
              'index_sha256': hashlib.sha256(index).hexdigest(),
              'tracked': tracked,
              'tracked_status': git('status', '--porcelain', '--untracked-files=no').decode(),
          }
          if (source['head'] != expected_head or source['tree'] != expected_tree
                  or source['index_tree'] != expected_index_tree
                  or source['tracked_status'] != expected_status):
              raise RuntimeError('whole source does not match reviewed base/candidate commit/tree/index')
          data = {'source': source}
          if stage != 'source':
              consumed = {}
              for parent in [root, Path(sys.prefix), Path(sysconfig.get_path('stdlib')),
                             Path(sys.executable).resolve(), destination/'probe-before.py',
                             destination/'probe-guard.py', destination/'probe-assess.py',
                             destination/'probe-assess-after.py', destination/'fix.patch',
                             destination/'test_complex_weight_regressions.py',
                             destination/'critical-runtime-guard.py']:
                  collect(parent, consumed)
              for command in ['git', 'ldd', 'nm']:
                  executable = shutil.which(command)
                  if executable is None:
                      raise RuntimeError('missing guard tool: '+command)
                  collect(Path(executable).resolve(), consumed)
              binaries = [Path(sys.executable).resolve()]
              extension_symbols = {}
              for name, item in consumed.items():
                  if item['type'] != 'file' or not (name.endswith('.so') or '.so.' in name):
                      continue
                  process = subprocess.run(['nm', '-D', '--defined-only', name],
                                           capture_output=True, text=True)
                  if process.returncode != 0:
                      raise RuntimeError('ELF export scan failed: '+name+' '+process.stderr)
                  symbols = sorted(line.split()[-1] for line in process.stdout.splitlines()
                                   if line.split() and line.split()[-1].startswith('PyInit_'))
                  if symbols:
                      extension_symbols[name] = symbols
                      binaries.append(Path(name))
              linked = {}
              for binary in sorted(set(binaries)):
                  process = subprocess.run(['ldd', str(binary)], capture_output=True, text=True)
                  if process.returncode not in [0, 1]:
                      raise RuntimeError('ELF dependency scan failed: '+str(binary))
                  if 'not found' in process.stdout:
                      raise RuntimeError('ELF dependency missing: '+str(binary)+' '+process.stdout)
                  for word in process.stdout.split():
                      if word.startswith('/') and Path(word).is_file():
                          path = Path(word).resolve()
                          linked[str(path)] = file_record(path)
              data.update(consumed=consumed, linked=linked, extension_symbols=extension_symbols,
                          elf_roots=sorted(str(binary) for binary in set(binaries)),
                          executable=str(Path(sys.executable).resolve()),
                          prefix=sys.prefix, base_prefix=sys.base_prefix)
          if stage == 'source':
              (destination/'guard-source.json').write_text(json.dumps(data, sort_keys=True))
          else:
              original = json.loads((destination/'guard-source.json').read_text())
              if original['source'] != source:
                  raise RuntimeError('original tracked source changed during install/probe')
              if stage == 'before':
                  (destination/('guard-before-'+snapshot_label+'.json')).write_text(json.dumps(data, sort_keys=True))
              elif stage == 'after':
                  before = json.loads((destination/('guard-before-'+snapshot_label+'.json')).read_text())
                  if before != data:
                      for key in ['consumed', 'linked']:
                          print('NEW108_CHANGED', key, [name for name in
                              set(before.get(key, {})) | set(data.get(key, {}))
                              if before.get(key, {}).get(name) != data.get(key, {}).get(name)], flush=True)
                      raise RuntimeError('consumed source/build/dependency/runtime guard changed')
              else:
                  raise RuntimeError('invalid guard stage')
          print('NEW108_GUARD', json.dumps({
              'stage': stage, 'snapshot_label': snapshot_label,
              'phase': os.environ.get('NEW119_PHASE'), 'head': source['head'], 'tree': source['tree'],
              'index_tree': source['index_tree'], 'index_sha256': source['index_sha256'],
              'tracked_count': len(tracked), 'all_actual_git_blobs_match': True,
              'filesystem_tracks_executable_mode': os.name != 'nt',
              'tracked_sha256': hashlib.sha256(json.dumps(tracked, sort_keys=True).encode()).hexdigest(),
              'consumed_count': len(data.get('consumed', {})),
              'consumed_sha256': hashlib.sha256(json.dumps(data.get('consumed', {}), sort_keys=True).encode()).hexdigest(),
              'linked_count': len(data.get('linked', {})),
              'elf_root_count': len(data.get('elf_roots', [])),
              'extension_root_count': len(data.get('extension_symbols', {})), 'unchanged': True,
          }), flush=True)
          NEW119_PROBE_GUARD_PY
          sha256sum "$NEW108_EVIDENCE/probe-guard.py"
      - name: Stage critical runtime provenance helper
        shell: bash
        run: |
          set -euo pipefail
          cat > "$NEW108_EVIDENCE/critical-runtime-guard.py" <<'NEW119_CRITICAL_RUNTIME_GUARD_PY'
          """Hosted-only critical runtime provenance, distinct from the complete ELF guard.
          
          This hashes explicit actual module/interpreter/solver/helper files. It does not
          claim an entire environment or transitive loader closure for official suites.
          """
          import hashlib
          import importlib
          import importlib.metadata
          import inspect
          import json
          import os
          from pathlib import Path
          import platform
          import subprocess
          import sys
          import sysconfig
          
          import lmfit
          import numpy as np
          import scipy
          from scipy.optimize import least_squares, leastsq
          
          root = Path(os.environ['NEW108_SOURCE']).resolve()
          destination = Path(os.environ['NEW108_EVIDENCE']).resolve()
          operation, label = sys.argv[1:3]
          if operation not in ['baseline', 'check'] or label not in ['public16', 'focused40', 'full-suite', 'style-docs']:
              raise RuntimeError('invalid critical provenance operation/label')
          
          
          def sha256(path):
              value = hashlib.sha256()
              with path.open('rb') as stream:
                  while chunk := stream.read(1024*1024):
                      value.update(chunk)
              return value.hexdigest()
          
          
          files = {}
          
          
          def add_file(path):
              path = Path(path).resolve()
              if not path.is_file():
                  raise RuntimeError('critical runtime file missing: '+str(path))
              files[str(path)] = {'bytes': path.stat().st_size, 'sha256': sha256(path)}
              return str(path)
          
          
          modules = {}
          
          
          def add_module(module):
              if getattr(module, '__file__', None):
                  path = add_file(module.__file__)
                  modules[module.__name__] = path
                  if module.__name__ == 'lmfit' or module.__name__.startswith('lmfit.'):
                      if not Path(path).is_relative_to(root):
                          raise RuntimeError('critical lmfit module outside whole source: '+path)
          
          
          for name in ['lmfit', 'lmfit.model', 'lmfit.minimizer', 'numpy', 'scipy',
                       'numpy._core._multiarray_umath', 'numpy.linalg._umath_linalg',
                       'scipy.optimize._minpack', 'scipy.optimize._lsq.trf',
                       'pytest', '_pytest.runner', '_pytest.python', '_pytest.assertion.rewrite']:
              add_module(importlib.import_module(name))
          # Hash every actual lmfit source module, including the generated version module.
          for path in sorted((root/'lmfit').glob('*.py')):
              add_file(path)
          
          functions = {}
          for name, function in [('scipy.optimize.leastsq', leastsq),
                                 ('scipy.optimize.least_squares', least_squares)]:
              module = importlib.import_module(function.__module__)
              add_module(module)
              source = inspect.getsourcefile(function)
              if source is None:
                  raise RuntimeError('solver has no inspectable source: '+name)
              record = {'module': function.__module__, 'qualname': function.__qualname__,
                        'source_file': add_file(source)}
              if hasattr(function, '__code__'):
                  record['function_code_sha256'] = hashlib.sha256(function.__code__.co_code).hexdigest()
              functions[name] = record
              # Follow the actual public solver's immediate numerical backend references.
              for key in ['_minpack', 'trf', 'dogbox', 'call_minpack']:
                  backend = getattr(function, '__globals__', {}).get(key)
                  if inspect.ismodule(backend):
                      add_module(backend)
                  elif inspect.isfunction(backend):
                      add_module(importlib.import_module(backend.__module__))
          
          helpers = {}
          for name in ['probe-guard.py', 'critical-runtime-guard.py', 'fix.patch']:
              path = destination/name
              helpers[name] = {'path': add_file(path), 'sha256': sha256(path)}
          if label in ['public16', 'focused40']:
              for name in ['probe-before.py', 'probe-assess.py', 'probe-assess-after.py',
                           'test_complex_weight_regressions.py']:
                  path = destination/name
                  helpers[name] = {'path': add_file(path), 'sha256': sha256(path)}
          
          interpreter = add_file(Path(sys.executable).resolve())
          for module in [hashlib, importlib, inspect, json, platform, subprocess, sysconfig]:
              add_module(module)
          source = {name: subprocess.check_output(['git', '-C', str(root), *args]).decode().strip()
                    for name, args in [('head', ['rev-parse', 'HEAD']),
                                       ('head_tree', ['rev-parse', 'HEAD^{tree}']),
                                       ('index_tree', ['write-tree'])]}
          data = {'scope': 'explicit actual source/module/solver/interpreter/helper files; not all runtime files or transitive linked libraries',
                  'source': source, 'phase': os.environ['NEW119_PHASE'], 'label': label,
                  'python': {'version': sys.version, 'implementation': platform.python_implementation(),
                             'platform': platform.platform(), 'executable': interpreter,
                             'prefix': sys.prefix, 'base_prefix': sys.base_prefix,
                             'stdlib': sysconfig.get_path('stdlib')},
                  'versions': {name: importlib.metadata.version(name) for name in
                               ['lmfit', 'numpy', 'scipy', 'asteval', 'uncertainties', 'dill', 'pytest']},
                  'runtime_versions': {'lmfit': lmfit.__version__, 'numpy': np.__version__,
                                       'scipy': scipy.__version__},
                  'declared_generated_outputs': {
                      'public16': ['runner-temporary raw observations/status/guard manifests'],
                      'focused40': ['runner-temporary pytest log/JUnit/status/guard manifests',
                                    'pytest .pytest_cache (excluded by the unchanged complete guard)'],
                      'full-suite': ['coverage HTML and .coverage', 'pytest .pytest_cache',
                                     'runner-temporary native logs/status/critical manifests',
                                     'Windows doc/_build, doc/examples, examples/documentation, doc/extensions.py'],
                      'style-docs': ['doc/_build, doc/examples, examples/documentation, doc/extensions.py',
                                     'gallery execution data and timing reports',
                                     'runner-temporary pre-commit environments, logs/status/critical manifests']
                  }[label],
                  'output_scope': 'Generated outputs are declared, not accepted as exceptions to tracked-source or critical-file checks; untracked outputs are outside this explicit-file snapshot.',
                  'modules': dict(sorted(modules.items())), 'solvers': functions,
                  'helpers': helpers, 'files': dict(sorted(files.items()))}
          snapshot = destination/('critical-baseline-'+label+'.json')
          if operation == 'baseline':
              snapshot.write_text(json.dumps(data, sort_keys=True))
          else:
              before = json.loads(snapshot.read_text())
              if before != data:
                  print('NEW119_CRITICAL_CHANGED_FILES', json.dumps(sorted(
                      name for name in set(before['files']) | set(data['files'])
                      if before['files'].get(name) != data['files'].get(name))), flush=True)
                  raise RuntimeError('critical runtime provenance changed during '+label)
          print('NEW119_CRITICAL_RUNTIME', json.dumps({
              'operation': operation, 'file_count': len(files),
              'manifest_sha256': hashlib.sha256(json.dumps(data, sort_keys=True).encode()).hexdigest(),
              'provenance': data, 'unchanged': operation == 'check'}, sort_keys=True), flush=True)
          NEW119_CRITICAL_RUNTIME_GUARD_PY
          sha256sum "$NEW108_EVIDENCE/critical-runtime-guard.py"
